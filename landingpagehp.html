<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMA Negeri 1 Sentani</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: url('https://pjjpapua-coder.github.io/cbt-smansa/bg661.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: #fff;
            padding: 20px;
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            text-align: center;
            padding: 20px;
        }

        .start-text {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
            font-weight: 400;
        }

        .start-btn {
            padding: 12px 28px;
            font-size: 15px;
            background: #fde047;
            color: #1e1b4b;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(253, 224, 71, 0.4);
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* --- CSS untuk Jam --- */
        .waktu-sekarang {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            padding: 8px 20px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 2;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .card {
            /* Mengubah warna ungu menjadi Dark Glassmorphism */
            background: rgba(15, 23, 42, 0.85); /* Warna slate gelap semi-transparan */
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(12px); /* Efek kaca */
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 2;
        }

        .logo {
            width: 100px;
            margin-bottom: 5px;
        }

        /* --- CSS untuk Copyright --- */
        .copyright-label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            font-weight: 300;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .info-text {
            margin-bottom: 15px;
        }

        .date-highlight {
            display: inline-block;
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 13px;
        }

        .status-text {
            font-size: 14px;
            color: #e0e7ff;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .btn {
            display: none;
            padding: 12px 25px;
            background: #ffffff;
            color: #0f172a; /* Mengubah teks ungu menjadi gelap agar serasi */
            text-decoration: none;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #f3f4f6;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Audio Visualizer Canvas */
        #audio-visualizer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 150px;
            z-index: 1;
            pointer-events: none;
        }

        /* Speaker Control Button */
        #audio-control {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        #audio-control:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: scale(1.1);
            border-color: #fde047;
        }

        #audio-control svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
    </style>
</head>

<body oncontextmenu="return false;">

    <div id="start-overlay">
        <p class="start-text">Selamat Datang di Halaman Assesment<br>SMA Negeri 1 Sentani</p>
        <button class="start-btn" id="start-btn">Mulai</button>
    </div>

    <audio id="local-audio" loop crossorigin="anonymous">
        <source src="https://raw.githubusercontent.com/pjjpapua-coder/samson/refs/heads/main/laskrpelangi.MP3" type="audio/mpeg">
    </audio>

    <canvas id="audio-visualizer"></canvas>

    <div id="audio-control" title="Mute/Unmute">
        <svg id="icon-unmute" viewBox="0 0 24 24" style="display: none;">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
        </svg>
        <svg id="icon-mute" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z" />
        </svg>
    </div>

    <div class="waktu-sekarang" id="waktu-display">
        Waktu Sekarang: Memuat...
    </div>

    <div class="card">
        <img src="https://res.cloudinary.com/gheeeibs/image/upload/v1782942867/smansalogo_weddws.png" class="logo" alt="Logo Smansa">
        
        <div class="copyright-label">@2026 Copyright Eko Yudhi, S.T, Gr</div>

        <h1>Selamat datang peserta Assesment UTS/UAS</h1>
        <p class="info-text">
            <span class="date-highlight">Sistem Terhubung ke Server</span>
        </p>

        <p class="status-text" id="status-message">Menghubungkan ke sistem...</p>

        <a href="https://pjjpapua-coder.github.io/cbt-smansa/modehp.html" class="btn" id="masuk-btn">Masuk ke Jadwal Ujian</a>
    </div>

    <script>
        function updateWaktu() {
            const now = new Date();
            
            const hari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const namaHari = hari[now.getDay()];
            
            const bulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            const tanggal = now.getDate();
            const namaBulan = bulan[now.getMonth()];
            const tahun = now.getFullYear();
            
            const formatTanggal = `${tanggal} ${namaBulan} ${tahun}`;

            const jam = String(now.getHours()).padStart(2, '0');
            const menit = String(now.getMinutes()).padStart(2, '0');
            const detik = String(now.getSeconds()).padStart(2, '0');
            const formatJam = `${jam}:${menit}:${detik}`;
            
            document.getElementById('waktu-display').innerText = `Waktu Sekarang: ${namaHari}, ${formatTanggal}, ${formatJam}`;
        }

        setInterval(updateWaktu, 1000);
        updateWaktu(); 
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDSSqyRJxxDjW7sJttHJzZ85t0bwpG6i18",
            authDomain: "smansa-stn.firebaseapp.com",
            projectId: "smansa-stn",
            storageBucket: "smansa-stn.firebasestorage.app",
            messagingSenderId: "942856203234",
            appId: "1:942856203234:web:26f61cb6a795e601ada7bb",
            measurementId: "G-1WZE2HPMW7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const targetUrl = "https://pjjpapua-coder.github.io/cbt-smansa/modehp.html";
        const statusMessage = document.getElementById("status-message");
        const masukBtn = document.getElementById("masuk-btn");
        const audioPlayer = document.getElementById('local-audio');

        const audioControl = document.getElementById('audio-control');
        const iconUnmute = document.getElementById('icon-unmute');
        const iconMute = document.getElementById('icon-mute');
        const canvas = document.getElementById('audio-visualizer');
        const ctx = canvas.getContext('2d');

        let audioContext;
        let analyser;
        let source;
        let isInitialized = false;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = 150;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function initAudioContext() {
            if (isInitialized) return;
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();

                source = audioContext.createMediaElementSource(audioPlayer);
                source.connect(analyser);
                analyser.connect(audioContext.destination);

                analyser.fftSize = 256;
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);

                isInitialized = true;

                function draw() {
                    requestAnimationFrame(draw);
                    analyser.getByteFrequencyData(dataArray);
                    ctx.clearRect(0, 0, canvas.width, canvas.height);

                    const barWidth = (canvas.width / bufferLength) * 2.5;
                    let barHeight;
                    let x = 0;

                    for (let i = 0; i < bufferLength; i++) {
                        barHeight = (dataArray[i] / 255) * canvas.height;
                        const hue = i * (360 / bufferLength) + (Date.now() / 15) % 360;
                        ctx.fillStyle = `hsl(${hue}, 100%, 50%)`;
                        ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                        x += barWidth + 1;
                    }
                }
                draw();
            } catch (e) {
                console.error("Web Audio API Error:", e);
            }
        }

        document.getElementById('start-btn').addEventListener('click', async function () {
            document.getElementById("start-overlay").style.display = 'none';
            
            initAudioContext();
            
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            audioPlayer.muted = false;
            audioPlayer.play().catch(e => console.log("Autoplay blocked:", e));
            
            iconUnmute.style.display = 'block';
            iconMute.style.display = 'none';
        });

        async function toggleMute() {
            if (!isInitialized) initAudioContext();
            if (audioContext && audioContext.state === 'suspended') {
                await audioContext.resume();
            }

            if (audioPlayer.paused) {
                audioPlayer.play().catch(e => console.log(e));
                audioPlayer.muted = false;
                iconUnmute.style.display = 'block';
                iconMute.style.display = 'none';
            } else {
                audioPlayer.muted = !audioPlayer.muted;
                if (audioPlayer.muted) {
                    iconUnmute.style.display = 'none';
                    iconMute.style.display = 'block';
                } else {
                    iconUnmute.style.display = 'block';
                    iconMute.style.display = 'none';
                }
            }
        }

        audioControl.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMute();
        });

        onSnapshot(doc(db, "settings", "security"), (docSnapshot) => {
            if (docSnapshot.exists()) {
                const data = docSnapshot.data();

                if (data.status_redirect === "ON") {
                    statusMessage.innerHTML = "Waktu assesment telah tiba! Mengalihkan...";
                    statusMessage.style.color = "#4ade80";
                    masukBtn.style.display = "inline-block";
                    window.location.href = targetUrl;
                } else {
                    statusMessage.innerHTML = "Menunggu Admin membuka ujian...";
                    statusMessage.style.color = "#fde047";
                    masukBtn.style.display = "none";
                }
            }
        });
    </script>
</body>
</html>
